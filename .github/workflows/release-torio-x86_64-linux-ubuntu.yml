name: Torio - Release (Linux x86_64 Ubuntu)

on:
  push:
    tags:
      - 'torio-x86_64-linux-ubuntu-v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checking Out Tagged Torio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Validating Tag Version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME##*-v}"
          PACKAGE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "torio") | .version')
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
          echo "RELEASE_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Building Release Binaries
        run: |
          cargo build --release
          cargo build --profile release-stripped
          mv target/release-stripped/torio target/release-stripped/torio-stripped

      - name: Publishing Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: changelogs/v${{ env.RELEASE_VERSION }}/README.md
          files: |
            target/release/torio
            target/release-stripped/torio-stripped
          draft: false
          fail_on_unmatched_files: true
