[package]
name = "torio"
description = "The project and toolchain manager for the Thrust Programming Language."
edition = "2024"
license = "GPL-3.0"
version = "0.1.0"
rust-version = "1.85.0"

authors = [
    "Thrush Team <thrushlangproject@gmail.com>",
    "Stevens Benavides <foss.stevens.benavides@gmail.com>"
]

homepage = "https://github.com/thrustlang/torio"
repository = "https://github.com/thrustlang/torio"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
isahc = "1.7.2"
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
terminal-spinners = "0.3.2"

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
debug = true
incremental = true

[profile.release-stripped]
inherits = "release"
opt-level = "z"
codegen-units = 1
lto = "fat"
debug = false
strip = "symbols"
