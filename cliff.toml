[changelog]
header = """
# Changelog\n
All notable changes to Torio are documented here.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} [**BREAKING**]{% endif %} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/thrustlang/torio/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^\\(.*feat\\(cli\\).*\\)",            group = "Features",      scope = "cli" },
  { message = "^\\(.*feat\\(toolchain\\).*\\)",      group = "Features",      scope = "toolchain" },
  { message = "^\\(.*feat\\(build\\).*\\)",          group = "Features",      scope = "build" },
  { message = "^\\(.*feat\\(run\\).*\\)",            group = "Features",      scope = "run" },
  { message = "^\\(.*feat\\(logic\\).*\\)",          group = "Features",      scope = "logic" },
  { message = "^\\(.*feat\\(release\\).*\\)",        group = "Project",       scope = "release" },
  { message = "^\\(.*feat\\(project-visual\\).*\\)", group = "Documentation", scope = "project-visual" },
  { message = "^\\(.*feat\\(project\\).*\\)",        group = "Project",       scope = "project" },
  { message = "^\\(.*feat\\(doc\\).*\\)",            group = "Documentation", scope = "doc" },
  { message = "^\\(.*fix\\(cli\\).*\\)",             group = "Bug Fixes",     scope = "cli" },
  { message = "^\\(.*fix\\(toolchain\\).*\\)",       group = "Bug Fixes",     scope = "toolchain" },
  { message = "^\\(.*fix\\(build\\).*\\)",           group = "Bug Fixes",     scope = "build" },
  { message = "^\\(.*fix\\(run\\).*\\)",             group = "Bug Fixes",     scope = "run" },
  { message = "^\\(.*fix\\(logic\\).*\\)",           group = "Bug Fixes",     scope = "logic" },
  { message = "^\\(.*fix\\(release\\).*\\)",         group = "Bug Fixes",     scope = "release" },
  { message = "^\\(.*fix\\(project-visual\\).*\\)",  group = "Bug Fixes",     scope = "project-visual" },
  { message = "^\\(.*fix\\(project\\).*\\)",         group = "Bug Fixes",     scope = "project" },
  { message = "^\\(.*fix\\(doc\\).*\\)",             group = "Bug Fixes",     scope = "doc" },
  { message = "^feat\\(cli\\)",            group = "Features",      scope = "cli" },
  { message = "^feat\\(toolchain\\)",      group = "Features",      scope = "toolchain" },
  { message = "^feat\\(build\\)",          group = "Features",      scope = "build" },
  { message = "^feat\\(run\\)",            group = "Features",      scope = "run" },
  { message = "^feat\\(logic\\)",          group = "Features",      scope = "logic" },
  { message = "^feat\\(release\\)",        group = "Project",       scope = "release" },
  { message = "^feat\\(project-visual\\)", group = "Documentation", scope = "project-visual" },
  { message = "^feat\\(project\\)",        group = "Project",       scope = "project" },
  { message = "^feat\\(doc\\)",            group = "Documentation", scope = "doc" },
  { message = "^feat\\(",                    group = "Features" },
  { message = "^fix\\(cli\\)",             group = "Bug Fixes",     scope = "cli" },
  { message = "^fix\\(toolchain\\)",       group = "Bug Fixes",     scope = "toolchain" },
  { message = "^fix\\(build\\)",           group = "Bug Fixes",     scope = "build" },
  { message = "^fix\\(run\\)",             group = "Bug Fixes",     scope = "run" },
  { message = "^fix\\(logic\\)",           group = "Bug Fixes",     scope = "logic" },
  { message = "^fix\\(release\\)",         group = "Bug Fixes",     scope = "release" },
  { message = "^fix\\(project-visual\\)",  group = "Bug Fixes",     scope = "project-visual" },
  { message = "^fix\\(project\\)",         group = "Bug Fixes",     scope = "project" },
  { message = "^fix\\(doc\\)",             group = "Bug Fixes",     scope = "doc" },
  { message = "^fix\\(",                     group = "Bug Fixes" },
  { message = ".*", skip = true },
]
commit_preprocessors = [
  { pattern = "^Merge .*", replace = "" },
  { pattern = "^`", replace = "" },
  { pattern = "\\)`", replace = ")" },
]
filter_commits = true
tag_pattern = "^torio-(x86_64-(linux-ubuntu|windows-msvc|macos)|aarch64-macos)(-dev)?-v[0-9]+\\.[0-9]+\\.[0-9]+$"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "newest"
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/thrustlang/torio/issues/$1" },
]
